[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worktree-gc"
version = "0.1.0"
description = "Fail-closed git worktree garbage collector (stdlib Python)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
worktree-gc = "worktree_gc.core:main"

[tool.setuptools]
packages = ["worktree_gc"]
